name: Deploy

# Every merge to main goes live without anyone running a deploy. Functions (the `demo` codebase) and the
# shop's Hosting site only. Firestore rules and indexes are never deployed from here, and certainly never
# with --force: the project is shared with Starfish.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Running under an environment makes GitHub record a Deployment on `production` for this commit, with
    # status `success` when the job finishes. The demo's reset script waits for it, and Starfish's fast-revert
    # window starts at its completion.
    environment: production
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # A clear failure here beats an opaque one from the sign-in step. Set up once with scripts/setup-gcp.sh.
      - name: Check the repository variables
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in FIREBASE_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (README, 'Deploy on merge')"
              missing=1
            fi
          done
          exit "$missing"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Keyless, like Starfish's deploy: no service-account key and no GitHub secret. The provider only accepts
      # tokens from this repository's jobs that run in the `production` environment.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Read the Hosting site from firebase.json
        run: echo "HOSTING_SITE=$(node -p "require('./firebase.json').hosting.site")" >> "$GITHUB_ENV"

      # The invoice PDF renderer is a private Cloud Run service, deployed from its own directory.
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy the PDF renderer
        run: >
          gcloud run deploy pdf-renderer
          --source pdf-renderer
          --project "$FIREBASE_PROJECT_ID"
          --region us-central1
          --service-account "demo-pdf-renderer@${FIREBASE_PROJECT_ID}.iam.gserviceaccount.com"
          --no-allow-unauthenticated
          --quiet

      # Only the shop's functions may call the renderer.
      - name: Let the shop's functions call the PDF renderer
        run: >
          gcloud run services add-iam-policy-binding pdf-renderer
          --project "$FIREBASE_PROJECT_ID"
          --region us-central1
          --member "serviceAccount:demo-functions@${FIREBASE_PROJECT_ID}.iam.gserviceaccount.com"
          --role roles/run.invoker
          --quiet

      # Firebase skips functions whose source is unchanged, so only changed functions are redeployed.
      - name: Deploy functions and Hosting
        run: >
          pnpm dlx firebase-tools@latest deploy
          --project "$FIREBASE_PROJECT_ID"
          --only "functions:demo,hosting:$HOSTING_SITE"
          --non-interactive

      - name: Record the live commit
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: pnpm --filter demo-functions exec node scripts/record-deploy.mjs
