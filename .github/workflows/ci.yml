name: CI

# Starfish judges a patch by this job: it pushes the patch to a starfish/<cycle> branch and waits for the
# check named `verify` on that commit. Without the starfish/** trigger no check ever appears and its cycle
# times out. This workflow must keep referencing no secret: a patch's code runs in it.
on:
  pull_request:
  push:
    branches: [main, 'starfish/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
